name: gridpbx

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${GRID_DB_DATABASE:-gridpbx}
      MYSQL_USER: ${GRID_DB_USERNAME:-gridpbx}
      MYSQL_PASSWORD: ${GRID_DB_PASSWORD:-gridpbx-local-change-me}
      MYSQL_ROOT_PASSWORD: ${GRID_DB_ROOT_PASSWORD:-gridpbx-root-local-change-me}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${GRID_DB_PORT:-3309}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  provisioner-catalog:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/provisioner-catalog/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/provisioner-catalog/phones.json:/usr/share/nginx/html/phones.json:ro
    ports:
      - "127.0.0.1:${GRID_PROVISIONER_CATALOG_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/phones"]
      interval: 5s
      timeout: 3s
      retries: 20

  grid-api:
    build:
      context: .
      dockerfile: docker/grid-api/Dockerfile
    restart: unless-stopped
    dns:
      - ${GRID_DNS_PRIMARY:-1.1.1.1}
      - ${GRID_DNS_SECONDARY:-8.8.8.8}
    environment:
      APP_NAME: GridPBX
      APP_ENV: local
      APP_KEY: ${GRID_API_APP_KEY:-}
      APP_DEBUG: "true"
      APP_URL: http://localhost:${GRID_API_PORT:-8081}
      FRONTEND_URL: http://localhost:${GRID_UI_PORT:-5173}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${GRID_DB_DATABASE:-gridpbx}
      DB_USERNAME: ${GRID_DB_USERNAME:-gridpbx}
      DB_PASSWORD: ${GRID_DB_PASSWORD:-gridpbx-local-change-me}
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SANCTUM_STATEFUL_DOMAINS: localhost:${GRID_UI_PORT:-5173},127.0.0.1:${GRID_UI_PORT:-5173},localhost:*,127.0.0.1:*
      GRID_ADMIN_EMAIL: ${GRID_ADMIN_EMAIL:-admin@gridpbx.local}
      GRID_ADMIN_PASSWORD: ${GRID_ADMIN_PASSWORD:-admin-change-me}
      SWITCH_BASE_URL: ${SWITCH_BASE_URL:-http://switch:8000/v2}
      SWITCH_PROVISIONER_URL: ${SWITCH_PROVISIONER_URL:-http://provisioner-catalog/api}
      SWITCH_PROVISIONER_AUTH_TYPE: ${SWITCH_PROVISIONER_AUTH_TYPE:-none}
      SWITCH_PROVISIONER_TOKEN: ${SWITCH_PROVISIONER_TOKEN:-}
      SWITCH_PROVISIONER_USERNAME: ${SWITCH_PROVISIONER_USERNAME:-}
      SWITCH_PROVISIONER_PASSWORD: ${SWITCH_PROVISIONER_PASSWORD:-}
      SWITCH_PROVISIONER_HEADER_NAME: ${SWITCH_PROVISIONER_HEADER_NAME:-X-Auth-Token}
      SWITCH_PROVISIONER_TIMEOUT: ${SWITCH_PROVISIONER_TIMEOUT:-10}
      SWITCH_PROVISIONER_VERIFY_TLS: ${SWITCH_PROVISIONER_VERIFY_TLS:-true}
      SWITCH_LINE_KEY_MUTATIONS_ENABLED: ${SWITCH_LINE_KEY_MUTATIONS_ENABLED:-false}
      SWITCH_API_KEY: ${SWITCH_API_KEY:-}
      SWITCH_ACCOUNT_ID: ${SWITCH_ACCOUNT_ID:-}
      SWITCH_ACCOUNT_NAME: ${SWITCH_ACCOUNT_NAME:-GridPBX}
      SWITCH_ACCOUNT_REALM: ${SWITCH_ACCOUNT_REALM:-gridpbx.local}
    volumes:
      - ./grid-api:/app
      - ./grid-api-switch:/grid-api-switch
      - grid-api-vendor:/app/vendor
    ports:
      - "127.0.0.1:${GRID_API_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      provisioner-catalog:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if [ -z "$$APP_KEY" ]; then export APP_KEY="$$(php artisan key:generate --show)"; fi
        php artisan migrate --force
        php artisan db:seed --force
        php artisan serve --host=0.0.0.0 --port=8081 --no-reload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20

  grid-ui:
    build:
      context: .
      dockerfile: docker/grid-ui/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${GRID_API_PORT:-8081}
    volumes:
      - ./grid-ui:/app
      - grid-ui-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${GRID_UI_PORT:-5173}:5173"
    depends_on:
      grid-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 20

  grid-ui-https-app:
    build:
      context: .
      dockerfile: docker/grid-ui/Dockerfile
    profiles: ["payment-https"]
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: https://localhost:${GRID_UI_HTTPS_PORT:-5443}
    volumes:
      - ./grid-ui:/app
      - grid-ui-https-node-modules:/app/node_modules
    depends_on:
      grid-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 20

  grid-ui-https:
    image: caddy:2.10-alpine
    profiles: ["payment-https"]
    restart: unless-stopped
    volumes:
      - ./docker/grid-ui-https/Caddyfile:/etc/caddy/Caddyfile:ro
      - grid-ui-https-data:/data
      - grid-ui-https-config:/config
    ports:
      - "127.0.0.1:${GRID_UI_HTTPS_PORT:-5443}:5443"
    depends_on:
      grid-api:
        condition: service_healthy
      grid-ui-https-app:
        condition: service_healthy

  grid-worker:
    build:
      context: .
      dockerfile: docker/grid-api/Dockerfile
    restart: unless-stopped
    dns:
      - ${GRID_DNS_PRIMARY:-1.1.1.1}
      - ${GRID_DNS_SECONDARY:-8.8.8.8}
    environment:
      APP_NAME: GridPBX
      APP_ENV: local
      APP_KEY: ${GRID_API_APP_KEY:-}
      APP_DEBUG: "true"
      APP_URL: http://localhost:${GRID_API_PORT:-8081}
      FRONTEND_URL: http://localhost:${GRID_UI_PORT:-5173}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${GRID_DB_DATABASE:-gridpbx}
      DB_USERNAME: ${GRID_DB_USERNAME:-gridpbx}
      DB_PASSWORD: ${GRID_DB_PASSWORD:-gridpbx-local-change-me}
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE_RETRY_AFTER: 150
      SWITCH_BASE_URL: ${SWITCH_BASE_URL:-http://switch:8000/v2}
      SWITCH_PROVISIONER_URL: ${SWITCH_PROVISIONER_URL:-http://provisioner-catalog/api}
      SWITCH_PROVISIONER_AUTH_TYPE: ${SWITCH_PROVISIONER_AUTH_TYPE:-none}
      SWITCH_PROVISIONER_TOKEN: ${SWITCH_PROVISIONER_TOKEN:-}
      SWITCH_PROVISIONER_USERNAME: ${SWITCH_PROVISIONER_USERNAME:-}
      SWITCH_PROVISIONER_PASSWORD: ${SWITCH_PROVISIONER_PASSWORD:-}
      SWITCH_PROVISIONER_HEADER_NAME: ${SWITCH_PROVISIONER_HEADER_NAME:-X-Auth-Token}
      SWITCH_PROVISIONER_TIMEOUT: ${SWITCH_PROVISIONER_TIMEOUT:-10}
      SWITCH_PROVISIONER_VERIFY_TLS: ${SWITCH_PROVISIONER_VERIFY_TLS:-true}
      SWITCH_LINE_KEY_MUTATIONS_ENABLED: ${SWITCH_LINE_KEY_MUTATIONS_ENABLED:-false}
      SWITCH_API_KEY: ${SWITCH_API_KEY:-}
      SWITCH_ACCOUNT_ID: ${SWITCH_ACCOUNT_ID:-}
    volumes:
      - ./grid-api:/app
      - ./grid-api-switch:/grid-api-switch
      - grid-api-vendor:/app/vendor
    depends_on:
      grid-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if [ -z "$$APP_KEY" ]; then export APP_KEY="$$(php artisan key:generate --show)"; fi
        php artisan queue:work redis --queue=sync,default --tries=3 --timeout=120 --sleep=2

volumes:
  mysql-data:
  redis-data:
  grid-api-vendor:
  grid-ui-node-modules:
  grid-ui-https-node-modules:
  grid-ui-https-data:
  grid-ui-https-config:
